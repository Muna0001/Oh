<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Unlisted on purpose: nothing links here and search engines are told to
       skip it. The full browser build of Oh-a-Synth, generated from the app's
       own index.html by tools/sync-synth-app.mjs; do not edit by hand. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <title>Oh-a-synth — Polyphonic Synthesizer</title>
  <link rel="stylesheet" href="app/css/fonts.css">
  <link rel="stylesheet" href="app/css/display-font.css">
  <link rel="stylesheet" href="app/css/ohasynth.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="oha-logo">
        <span class="oha-brand">Oh-a-synth</span>
        <span class="oha-stripes"><i></i><i></i><i></i><i></i></span>
        <span class="oha-sub">POLYPHONIC SYNTHESIZER</span>
      </div>
      <!-- the patch menu, the patch display and its step buttons, joined into one piece -->
      <div class="oha-patchbar">
        <button id="patch-bank" class="oha-step" type="button" aria-label="Patch menu"
                aria-haspopup="menu" aria-expanded="false"></button>
        <div class="oha-display-group">
          <button id="patch-button" class="oha-display" type="button" aria-haspopup="dialog"
                  aria-expanded="false"><span class="oha-display-ghost" aria-hidden="true"></span><span
                  id="patch-button-name" class="oha-display-text" aria-hidden="true"></span></button>
          <button id="patch-prev" class="oha-step" type="button" aria-label="Previous patch"></button>
          <button id="patch-next" class="oha-step" type="button" aria-label="Next patch"></button>
        </div>
      </div>
      <!-- the settings menu: patch folder, Audio/MIDI settings, About -->
      <button id="settings-button" class="oha-step" type="button" aria-label="Settings"
              aria-haspopup="menu" aria-expanded="false"></button>
      <input id="patch-import-file" type="file" accept=".json,application/json" hidden>
    </header>

    <main id="panel"></main>

    <section id="monitor"></section>

    <section id="bottom">
      <div id="bender"></div>
      <div id="keyboard"></div>
      <div id="kbd-help">Z / X : octave &nbsp;·&nbsp; A W S E D F T G Y H U J … : play</div>
    </section>
  </div>

  <script src="app/js/engine/worklet.js"></script>
  <script src="app/js/engine/engine.js"></script>
  <script src="app/js/engine/presets.js"></script>
  <script src="app/js/ui/icons.js"></script>
  <script src="app/js/ui/menu.js"></script>
  <script src="app/js/ui/panel.js"></script>
  <script src="app/js/ui/monitor.js"></script>
  <script src="app/js/ui/keyboard.js"></script>
  <script src="app/js/ui/midi.js"></script>
  <script src="app/js/main.js"></script>
</body>
</html>
